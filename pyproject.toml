[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "pytest-jscov"
version = "0.1.0"
description = "Pytest plugin for JavaScript coverage via Playwright CDP"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pytest"]

[project.entry-points."pytest11"]
jscov = "pytest_jscov.plugin"
