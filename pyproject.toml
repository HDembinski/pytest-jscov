[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "pytest-jscov"
dynamic = ["version"]
description = "Pytest plugin for JavaScript coverage via Playwright CDP"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.58.0", "pytest", "pytest-cov"]

[project.urls]
Repository = "https://github.com/HDembinski/pytest-jscov"

[project.optional-dependencies]
test = ["anyio>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
anyio_mode = "auto"

[project.entry-points."pytest11"]
jscov = "pytest_jscov.plugin"

[tool.pdm.version]
source = "scm"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["D", "E", "F", "I", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.coverage.run]
plugins = ["pytest_jscov.covplugin"]

[tool.coverage.pytest_jscov.covplugin]
static_root = "tests/data/static"
